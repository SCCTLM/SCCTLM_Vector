<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SCCTLM Vector</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="brand">
    <img class="logo" src="assets/logo.svg" width="22" height="22" alt="">
    <span class="wordmark">SCCTLM <b>Vector</b></span>
    <span id="version-label" class="muted version"></span>
  </header>

  <div id="tabs" class="tabs">
    <button class="tab on" data-tab="images">Images</button>
    <button class="tab" data-tab="pdf">PDF</button>
  </div>

  <section data-pane="images">
    <h4>Preset</h4>
    <div class="row">
      <select id="preset-select"></select>
      <button id="preset-apply" title="Apply selected preset">Apply</button>
    </div>
    <div class="row">
      <button id="preset-save">Save as…</button>
      <button id="preset-rename">Rename</button>
      <button id="preset-delete">Delete</button>
    </div>
    <div class="row" id="name-row" hidden>
      <span id="name-label" class="muted"></span>
      <input id="name-input" type="text" spellcheck="false">
      <button id="name-ok">OK</button>
      <button id="name-cancel">Cancel</button>
    </div>
  </section>

  <section>
    <h4>Artboards <span id="doc-name" class="muted"></span></h4>
    <div class="row">
      <button id="ab-all">All</button>
      <button id="ab-none">None</button>
    </div>
    <div id="artboards" class="list"></div>
  </section>

  <section data-pane="images">
    <h4>Formats</h4>
    <div id="formats" class="row">
      <label class="pill"><input type="checkbox" value="png" checked><span>PNG</span></label>
      <label class="pill"><input type="checkbox" value="jpg"><span>JPG</span></label>
      <label class="pill"><input type="checkbox" value="svg"><span>SVG</span></label>
      <label class="pill"><input type="checkbox" value="pdf"><span>PDF</span></label>
    </div>
    <h4>Scale</h4>
    <div id="scales" class="row">
      <button class="chip on" data-scale="1">1x</button>
      <button class="chip" data-scale="2">2x</button>
      <button class="chip" data-scale="3">3x</button>
      <button class="chip" data-scale="4">4x</button>
    </div>
  </section>

  <section data-pane="images">
    <h4>File name</h4>
    <input id="template" type="text" spellcheck="false">
    <div id="tokens" class="row">
      <button data-token="{doc}">doc</button>
      <button data-token="{artboard}">artboard</button>
      <button data-token="{index}">index</button>
      <button data-token="{scale}">scale</button>
      <button data-token="{format}">format</button>
      <button data-token="{date}">date</button>
    </div>
    <div class="muted">Example: <span id="example">-</span></div>
  </section>

  <section data-pane="pdf">
    <h4>Mode</h4>
    <div id="pdf-modes" class="cards">
      <button class="card on" data-mode="print">
        <b>Print</b>
        <span class="muted">Images keep their resolution (no downsampling), JPEG maximum.</span>
        <span class="size" id="pdf-size-print">-</span>
      </button>
      <button class="card" data-mode="review">
        <b>Review</b>
        <span class="muted">Images above 225 ppi reduced to 150 ppi, JPEG quality set below. For email or chat.</span>
        <span class="size" id="pdf-size-review">-</span>
      </button>
    </div>
    <div id="pdf-quality-row" class="row">
      <span class="muted">Review image quality</span>
      <button class="chip on" data-quality="high">High</button>
      <button class="chip" data-quality="medium">Medium</button>
    </div>
    <h4>Layout</h4>
    <div id="pdf-layout" class="row">
      <button class="chip on" data-layout="single">One multi-page PDF</button>
      <button class="chip" data-layout="separate">One PDF per artboard</button>
    </div>
    <div class="row">
      <span class="muted" id="pdf-estimate-note"></span>
      <button id="pdf-recalc">Calculate size</button>
    </div>
    <div class="muted">Editing data is always removed, so open the PDF in Illustrator only for viewing. Keep your .ai file.</div>
  </section>

  <section>
    <h4>Output folder</h4>
    <div class="row">
      <input id="outdir" type="text" spellcheck="false">
      <button id="browse">Browse…</button>
    </div>
  </section>

  <div id="update-banner" class="banner" hidden>
    <span id="update-text"></span>
    <button id="update-install" hidden>Install</button>
  </div>

  <button id="export" class="primary" data-pane="images">Export</button>
  <button id="pdf-export" class="primary" data-pane="pdf">Export PDF</button>
  <div id="status" class="muted"></div>
  <ul id="results" class="list"></ul>
  <div class="foot">
    <button id="update-check" class="link" hidden>Check for updates</button>
  </div>

  <script src="lib/CSInterface.js"></script>
  <script src="bridge.js"></script>
  <script src="presets.js"></script>
  <script src="pdf-format.js"></script>
  <script src="config.js"></script>
  <script src="updater.js"></script>
  <script src="update-ui.js"></script>
  <script src="panel.js"></script>
  <script src="pdf-panel.js"></script>
</body>
</html>
